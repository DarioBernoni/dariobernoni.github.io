<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <button class="nav-toggle" aria-label="Apri menu" aria-expanded="false">☰</button>

    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/chi-sono.html' | relative_url }}">Chi sono</a>
      <a href="{{ '/articoli.html' | relative_url }}">Articoli</a>
      <a href="{{ '/contatti.html' | relative_url }}">Contatti</a>
    </nav>
  </div>
</header>

<main class="container content">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    © 2026 Dario Bernoni · Ingegnere Informatico e Allenatore di Calcio
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var btn = document.querySelector('.nav-toggle');
  var nav = document.querySelector('.site-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    nav.classList.toggle('open');
    var expanded = nav.classList.contains('open');
    btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  });
});
</script>

</body>
</html>
