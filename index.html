<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dario Bernoni</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1a1a1a;
    }

    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .text {
      flex: 1;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 10px;
      color: #0d2d62;
    }

    h2 {
      font-size: 32px;
      font-weight: normal;
      color: #2d5ca8;
      margin-top: 0;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      background: #0d2d62;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-right: 10px;
    }

    .photo {
      flex: 1;
      text-align: center;
    }

    .photo img {
      max-width: 100%;
      border-radius: 20px;
    }

    @media(max-width: 900px) {
      .hero {
        flex-direction: column;
      }

      h1 {
        font-size: 42px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="hero">

  <div class="text">
    <h1>Dario Bernoni</h1>

    <h2>Tra ingegneria e calcio</h2>

    <p>
      Allenatore e istruttore presso Curi Pescara,
      laureando magistrale in Ingegneria Informatica.
    </p>

    <p>
      Uno spazio dedicato a calcio giovanile,
      metodologia, tecnica e crescita dei giovani calciatori.
    </p>

    <div class="buttons">
      <a class="btn" href="#">Articoli</a>
      <a class="btn" href="#">Chi sono</a>
    </div>
  </div>

  <div class="photo">
    <img src="foto-principale.jpg.jpeg" alt="Dario Bernoni">
  </div>

</div>

</body>
</html>
